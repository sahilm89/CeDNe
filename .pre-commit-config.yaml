# Pre-commit hooks for CeDNe. Run locally on `git commit`.
#
# First-time setup (one-shot, per developer):
#   conda run -n cedne-py310 pre-commit install
#
# To run all hooks on the whole repo (e.g. before the first cut):
#   conda run -n cedne-py310 pre-commit run --all-files
#
# Ruff rule selection here is intentionally minimal (defaults: E4, E7, E9, F).
# Ratchet up to E,F,W,I,N,UP,B,SIM,RUF,S in Week 2 of the pre-release hardening
# (see CeDNe_web/notes/audit/risk_register.csv and the plan file).
#
# ``examples/notebooks/archive/`` is excluded everywhere: it contains older
# experimental scripts that target Python >=3.12 syntax and are not part of
# the current codebase. They live there as historical reference only.
exclude: ^examples/notebooks/archive/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=5000"]
      - id: check-case-conflict
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
