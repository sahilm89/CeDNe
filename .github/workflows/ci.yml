name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Code quality — runs ruff (lint + format check) as an informational signal.
  # `continue-on-error: true` keeps it from blocking PRs while the existing
  # ~279 ruff findings get cleaned up incrementally. Flip the flag once the
  # baseline is green (tracked: TEST-P2-RUFFBASE in risk register).
  code-quality:
    name: Code Quality (Ruff)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install "ruff==0.7.4"

      - name: Lint with ruff
        run: ruff check src/cedne tests

      - name: Check formatting with ruff
        run: ruff format --check src/cedne tests

  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"

    - name: Install Poetry
      run: |
        curl -sSL https://install.python-poetry.org | python3 -
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libpq-dev

    - name: Cache Poetry virtualenv
      uses: actions/cache@v3
      with:
        path: ~/.cache/pypoetry/virtualenvs
        key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
        restore-keys: |
          poetry-${{ runner.os }}-

    - name: Install dependencies with dev extras
      run: poetry install --with dev

    - name: Run unit tests
      run: poetry run pytest

    # Will add notebooks to test later
